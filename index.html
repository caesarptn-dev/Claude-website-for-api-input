<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<style>
  :root {
    --bg:#faf9f5; --panel:#ffffff; --text:#1f1e1d; --muted:#6b6a68; --border:#e5e3dc;
    --accent:#c96442; --user:#efece3; --code:#f3f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --panel:#30302e; --text:#f0eee6; --muted:#a09e96; --border:#43423e;
            --accent:#d97757; --user:#3a3935; --code:#1f1e1d; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:17px; margin:0; font-weight:600; flex:1; }
  header h1 span { color:var(--accent); }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--text);
           border-radius:8px; padding:6px 12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #chat { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:760px; margin:0 auto; }
  .msg { margin:0 0 18px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:92%; padding:10px 14px; border-radius:14px; overflow-wrap:anywhere; }
  .user .bubble { background:var(--user); white-space:pre-wrap; }
  .assistant .bubble { background:transparent; padding-left:0; }
  .bubble p:first-child { margin-top:0; } .bubble p:last-child { margin-bottom:0; }
  .bubble pre { background:var(--code); padding:12px; border-radius:8px; overflow-x:auto; font-size:14px; position:relative; }
  .bubble code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:.92em; }
  .bubble pre code { background:none; padding:0; }
  .bubble table { border-collapse:collapse; } .bubble th,.bubble td { border:1px solid var(--border); padding:4px 8px; }
  .err { color:#c0392b; }
  .empty { text-align:center; color:var(--muted); margin-top:18vh; }
  .empty h2 { color:var(--text); font-weight:600; }
  footer { padding:12px 16px 16px; }
  .composer { display:flex; gap:8px; align-items:flex-end; background:var(--panel); border:1px solid var(--border);
              border-radius:14px; padding:8px; }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:inherit;
             max-height:200px; padding:6px 8px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:20px;
           width:min(480px,92vw); }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog label { display:block; margin:12px 0 4px; font-size:14px; color:var(--muted); }
  dialog input,dialog select,dialog textarea { width:100%; border:1px solid var(--border); background:var(--bg);
              color:var(--text); border-radius:8px; padding:8px; font:inherit; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .note { font-size:13px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1><span>✻</span> Claude Chat</h1>
  <button id="newBtn">New chat</button>
  <button id="setBtn">Settings</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<footer>
  <div class="wrap">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message Claude…  (Enter to send, Shift+Enter for new line)"></textarea>
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </div>
</footer>

<dialog id="dlg">
  <h3 style="margin:0">Settings</h3>
  <label for="key">Anthropic API key</label>
  <input id="key" type="password" placeholder="sk-ant-..." autocomplete="off">
  <div class="note">Stored only in this browser (localStorage). Sent only to Anthropic, or to your proxy URL if you set one.</div>

  <label for="proxy">Proxy URL (optional, replaces the API key)</label>
  <input id="proxy" type="url" placeholder="https://your-worker.workers.dev">

  <label for="model">Model</label>
  <select id="model">
    <option value="claude-sonnet-5-5">Claude Sonnet 5.5</option>
    <option value="claude-opus-5-5">Claude Opus 5.5</option>
    <option value="claude-haiku-5-5">Claude Haiku 5.5</option>
    <option value="claude-fable-5-1">Claude Fable 5.1</option>
  </select>

  <label for="system">System prompt (optional)</label>
  <textarea id="system" rows="3" placeholder="You are a helpful assistant."></textarea>

  <label for="maxTokens">Max output tokens</label>
  <input id="maxTokens" type="number" min="256" max="64000" value="4096">

  <div class="row">
    <button id="clearBtn">Clear saved data</button>
    <button id="closeBtn" class="primary">Save</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const store = {
  get: (k, d="") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};

let messages = [];
let controller = null;

// ---------- settings ----------
function loadSettings() {
  $("key").value = store.get("apiKey");
  $("proxy").value = store.get("proxy");
  $("model").value = store.get("model", "claude-sonnet-5-5");
  $("system").value = store.get("system");
  $("maxTokens").value = store.get("maxTokens", "4096");
}
function saveSettings() {
  store.set("apiKey", $("key").value.trim());
  store.set("proxy", $("proxy").value.trim());
  store.set("model", $("model").value);
  store.set("system", $("system").value);
  store.set("maxTokens", $("maxTokens").value);
}
$("setBtn").onclick = () => $("dlg").showModal();
$("closeBtn").onclick = () => { saveSettings(); $("dlg").close(); };
$("clearBtn").onclick = () => {
  if (!confirm("Remove your API key and all saved settings from this browser?")) return;
  ["apiKey","proxy","model","system","maxTokens"].forEach(store.del); loadSettings();
};
loadSettings();

// ---------- rendering ----------
function renderEmpty() {
  $("log").innerHTML = `<div class="empty"><h2>How can I help today?</h2>
    <p>Add your API key in <b>Settings</b> to get started.</p></div>`;
}
function addMsg(role, text="") {
  if (!messages.length && $("log").querySelector(".empty")) $("log").innerHTML = "";
  const m = document.createElement("div"); m.className = "msg " + role;
  const b = document.createElement("div"); b.className = "bubble";
  m.appendChild(b); $("log").appendChild(m);
  setContent(b, role, text); scrollDown();
  return b;
}
function setContent(el, role, text) {
  if (role === "user") el.textContent = text;
  else el.innerHTML = DOMPurify.sanitize(marked.parse(text || "…"));
}
function scrollDown() { $("chat").scrollTop = $("chat").scrollHeight; }

// ---------- chat ----------
async function send() {
  if (controller) { controller.abort(); return; }           // acts as Stop while streaming
  const text = $("input").value.trim();
  if (!text) return;

  const proxy = store.get("proxy"), key = store.get("apiKey");
  if (!proxy && !key) { $("dlg").showModal(); return; }

  $("input").value = ""; autosize();
  addMsg("user", text);
  messages.push({ role: "user", content: text });

  const bubble = addMsg("assistant");
  let full = "";
  controller = new AbortController();
  $("sendBtn").textContent = "Stop";

  const body = {
    model: store.get("model", "claude-sonnet-5-5"),
    max_tokens: parseInt(store.get("maxTokens", "4096"), 10) || 4096,
    stream: true,
    messages
  };
  const sys = store.get("system").trim();
  if (sys) body.system = sys;

  const url = proxy || "https://api.anthropic.com/v1/messages";
  const headers = { "content-type": "application/json" };
  if (!proxy) {
    headers["x-api-key"] = key;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }

  try {
    const res = await fetch(url, { method:"POST", headers, body:JSON.stringify(body), signal:controller.signal });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { const j = await res.json(); msg = j.error?.message || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split("\n\n"); buf = parts.pop();
      for (const part of parts) {
        const line = part.split("\n").find(l => l.startsWith("data:"));
        if (!line) continue;
        let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
        if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") {
          full += ev.delta.text; setContent(bubble, "assistant", full); scrollDown();
        } else if (ev.type === "error") {
          throw new Error(ev.error?.message || "Stream error");
        }
      }
    }
    messages.push({ role:"assistant", content: full });
  } catch (e) {
    if (e.name === "AbortError") {
      if (full) messages.push({ role:"assistant", content: full }); else messages.pop();
    } else {
      messages.pop();
      bubble.innerHTML += `<p class="err">⚠ ${DOMPurify.sanitize(e.message)}</p>`;
    }
  } finally {
    controller = null; $("sendBtn").textContent = "Send";
  }
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("sendBtn").onclick = send;
$("newBtn").onclick = () => { if (controller) controller.abort(); messages = []; renderEmpty(); };
renderEmpty();
</script>
</body>
</html>
