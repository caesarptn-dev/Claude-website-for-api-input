<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
  :root {
    --bg:#faf9f5; --panel:#ffffff; --text:#1f1e1d; --muted:#6b6a68; --border:#e5e3dc;
    --accent:#c96442; --user:#efece3; --code:#f3f1ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#262624; --panel:#30302e; --text:#f0eee6; --muted:#a09e96; --border:#43423e;
            --accent:#d97757; --user:#3a3935; --code:#1f1e1d; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--text); font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border); background:var(--panel); }
  header h1 { font-size:17px; margin:0; font-weight:600; flex:1; }
  header h1 span { color:var(--accent); }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--panel); color:var(--text);
           border-radius:8px; padding:6px 12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #chat { flex:1; overflow-y:auto; padding:20px 16px; }
  .wrap { max-width:760px; margin:0 auto; }
  .msg { margin:0 0 18px; display:flex; }
  .msg.user { justify-content:flex-end; }
  .bubble { max-width:92%; padding:10px 14px; border-radius:14px; overflow-wrap:anywhere; }
  .user .bubble { background:var(--user); white-space:pre-wrap; }
  .assistant .bubble { background:transparent; padding-left:0; }
  .bubble p:first-child { margin-top:0; } .bubble p:last-child { margin-bottom:0; }
  .bubble pre { background:var(--code); padding:12px; border-radius:8px; overflow-x:auto; font-size:14px; }
  .bubble code { background:var(--code); padding:1px 5px; border-radius:4px; font-size:.92em; }
  .bubble pre code { background:none; padding:0; }
  .bubble table { border-collapse:collapse; } .bubble th,.bubble td { border:1px solid var(--border); padding:4px 8px; }
  .bubble img.thumb { max-width:220px; max-height:160px; border-radius:8px; display:block; margin:6px 0; }
  .chip { display:inline-flex; align-items:center; gap:6px; background:var(--code); border:1px solid var(--border);
          border-radius:999px; padding:2px 10px; font-size:13px; margin:2px 4px 2px 0; }
  .chip b { cursor:pointer; color:var(--muted); }
  .err { color:#c0392b; }
  .empty { text-align:center; color:var(--muted); margin-top:18vh; }
  .empty h2 { color:var(--text); font-weight:600; }
  footer { padding:12px 16px 16px; }
  #chips { min-height:0; margin-bottom:6px; }
  .composer { display:flex; gap:8px; align-items:flex-end; background:var(--panel); border:1px solid var(--border);
              border-radius:14px; padding:8px; }
  .composer.drag { border-color:var(--accent); }
  textarea { flex:1; resize:none; border:0; outline:0; background:transparent; color:var(--text); font:inherit;
             max-height:200px; padding:6px 8px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:14px; padding:20px;
           width:min(500px,92vw); max-height:90vh; overflow:auto; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  dialog label { display:block; margin:12px 0 4px; font-size:14px; color:var(--muted); }
  dialog input,dialog select,dialog textarea { width:100%; border:1px solid var(--border); background:var(--bg);
              color:var(--text); border-radius:8px; padding:8px; font:inherit; }
  dialog .row { display:flex; gap:8px; justify-content:flex-end; margin-top:18px; }
  .note { font-size:13px; color:var(--muted); margin-top:6px; }
</style>
</head>
<body>
<header>
  <h1><span>✻</span> Claude Chat</h1>
  <button id="newBtn">New chat</button>
  <button id="setBtn">Settings</button>
</header>

<main id="chat"><div class="wrap" id="log"></div></main>

<footer>
  <div class="wrap">
    <div id="chips"></div>
    <div class="composer" id="composer">
      <button id="attachBtn" title="Attach files" aria-label="Attach files">📎</button>
      <input id="file" type="file" multiple hidden
             accept="image/*,.pdf,.docx,.txt,.md,.csv,.tsv,.json,.xml,.yaml,.yml,.html,.css,.js,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.sh,.sql,.log,.ini,.toml,.tex">
      <textarea id="input" rows="1" placeholder="Message Claude…  (Enter to send, Shift+Enter for new line, drop files here)"></textarea>
      <button id="sendBtn" class="primary">Send</button>
    </div>
  </div>
</footer>

<dialog id="dlg">
  <h3 style="margin:0">Settings</h3>

  <label for="provider">API format</label>
  <select id="provider">
    <option value="openai">OpenAI-compatible (chat/completions)</option>
    <option value="anthropic">Anthropic Messages API</option>
  </select>

  <label for="endpoint">Endpoint URL</label>
  <input id="endpoint" type="url">
  <div class="note">OpenAI-compatible default: https://radoxai.com/v1/chat/completions &nbsp;|&nbsp; Anthropic: https://api.anthropic.com/v1/messages</div>

  <label for="key">API key</label>
  <input id="key" type="password" placeholder="paste your key" autocomplete="off">
  <div class="note">Saved only in this browser (localStorage) and sent only to the endpoint above or your proxy. Never commit it to GitHub.</div>

  <label for="proxy">Proxy URL (optional, replaces the key and endpoint)</label>
  <input id="proxy" type="url" placeholder="https://your-worker.workers.dev">

  <label for="model">Model</label>
  <input id="model" list="models" placeholder="claude-opus-4.7">
  <datalist id="models">
    <option value="claude-opus-4.7"><option value="claude-sonnet-5-5"><option value="claude-opus-5-5">
    <option value="claude-haiku-5-5"><option value="claude-fable-5-1">
  </datalist>

  <label for="temperature">Temperature</label>
  <input id="temperature" type="number" min="0" max="1" step="0.1" value="1">

  <label for="maxTokens">Max output tokens</label>
  <input id="maxTokens" type="number" min="256" max="64000" value="8192">

  <label for="system">System prompt (optional)</label>
  <textarea id="system" rows="3" placeholder="You are a helpful assistant."></textarea>

  <div class="row">
    <button id="clearBtn">Clear saved data</button>
    <button id="closeBtn" class="primary">Save</button>
  </div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const store = {
  get: (k, d="") => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: k => { try { localStorage.removeItem(k); } catch {} }
};
const DEFAULT_ENDPOINT = {
  openai: "https://radoxai.com/v1/chat/completions",
  anthropic: "https://api.anthropic.com/v1/messages"
};
const MAX_TEXT = 200000;           // chars per text file
const MAX_FILE_BYTES = 20 * 1024 * 1024;

let messages = [];     // {role, text, files:[{name,kind,mime,text?,dataUrl?}]}
let pending = [];      // files attached to the next message
let controller = null;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

// ---------- settings ----------
const fields = ["provider","endpoint","key","proxy","model","temperature","maxTokens","system"];
const keyMap = { key:"apiKey" };
function loadSettings() {
  const prov = store.get("provider", "openai");
  $("provider").value = prov;
  $("endpoint").value = store.get("endpoint", DEFAULT_ENDPOINT[prov]);
  $("key").value = store.get("apiKey");
  $("proxy").value = store.get("proxy");
  $("model").value = store.get("model", "claude-opus-4.7");
  $("temperature").value = store.get("temperature", "1");
  $("maxTokens").value = store.get("maxTokens", "8192");
  $("system").value = store.get("system");
}
function saveSettings() {
  fields.forEach(f => store.set(keyMap[f] || f, $(f).value.trim ? $(f).value.trim() : $(f).value));
}
$("provider").onchange = () => { $("endpoint").value = DEFAULT_ENDPOINT[$("provider").value]; };
$("setBtn").onclick = () => $("dlg").showModal();
$("closeBtn").onclick = () => { saveSettings(); $("dlg").close(); };
$("clearBtn").onclick = () => {
  if (!confirm("Remove your API key and all saved settings from this browser?")) return;
  fields.forEach(f => store.del(keyMap[f] || f)); loadSettings();
};
loadSettings();

// ---------- file import ----------
const TEXT_EXT = /\.(txt|md|csv|tsv|json|xml|ya?ml|html?|css|jsx?|tsx?|py|java|c|cpp|h|cs|go|rs|rb|php|sh|sql|log|ini|toml|tex)$/i;

function readAs(file, how) {
  return new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error);
    how === "text" ? r.readAsText(file) : how === "buffer" ? r.readAsArrayBuffer(file) : r.readAsDataURL(file);
  });
}
function downscale(dataUrl, max = 1568) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1 && dataUrl.length < 4e6) return res(dataUrl);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res(c.toDataURL("image/jpeg", 0.88));
    };
    img.onerror = () => res(dataUrl);
    img.src = dataUrl;
  });
}
async function pdfText(file) {
  const pdf = await pdfjsLib.getDocument({ data: await readAs(file, "buffer") }).promise;
  let out = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    out += `\n--- page ${i} ---\n` + content.items.map(t => t.str).join(" ");
    if (out.length > MAX_TEXT) break;
  }
  return out;
}
async function importFile(file) {
  if (file.size > MAX_FILE_BYTES) throw new Error(`${file.name} is larger than 20 MB`);
  if (file.type.startsWith("image/")) {
    const url = await downscale(await readAs(file, "url"));
    return { name:file.name, kind:"image", mime:url.slice(5, url.indexOf(";")), dataUrl:url };
  }
  let text;
  if (/\.pdf$/i.test(file.name) || file.type === "application/pdf") text = await pdfText(file);
  else if (/\.docx$/i.test(file.name)) text = (await mammoth.extractRawText({ arrayBuffer: await readAs(file, "buffer") })).value;
  else if (TEXT_EXT.test(file.name) || file.type.startsWith("text/")) text = await readAs(file, "text");
  else throw new Error(`${file.name}: unsupported file type`);
  let truncated = false;
  if (text.length > MAX_TEXT) { text = text.slice(0, MAX_TEXT); truncated = true; }
  return { name:file.name, kind:"text", text: text + (truncated ? "\n[...truncated]" : "") };
}
async function addFiles(list) {
  for (const f of list) {
    try { pending.push(await importFile(f)); }
    catch (e) { alert(e.message); }
  }
  renderChips();
}
function renderChips() {
  $("chips").innerHTML = "";
  pending.forEach((f, i) => {
    const c = document.createElement("span"); c.className = "chip";
    c.textContent = (f.kind === "image" ? "🖼 " : "📄 ") + f.name + " ";
    const x = document.createElement("b"); x.textContent = "✕"; x.onclick = () => { pending.splice(i, 1); renderChips(); };
    c.appendChild(x); $("chips").appendChild(c);
  });
}
$("attachBtn").onclick = () => $("file").click();
$("file").onchange = e => { addFiles([...e.target.files]); e.target.value = ""; };
$("composer").addEventListener("dragover", e => { e.preventDefault(); $("composer").classList.add("drag"); });
$("composer").addEventListener("dragleave", () => $("composer").classList.remove("drag"));
$("composer").addEventListener("drop", e => { e.preventDefault(); $("composer").classList.remove("drag"); addFiles([...e.dataTransfer.files]); });
$("input").addEventListener("paste", e => {
  const files = [...(e.clipboardData?.files || [])];
  if (files.length) { e.preventDefault(); addFiles(files); }
});

// ---------- rendering ----------
function renderEmpty() {
  $("log").innerHTML = `<div class="empty"><h2>How can I help today?</h2>
    <p>Add your API key in <b>Settings</b>, then chat or attach files with 📎.</p></div>`;
}
function addMsg(role, text = "", files = []) {
  const empty = $("log").querySelector(".empty"); if (empty) empty.remove();
  const m = document.createElement("div"); m.className = "msg " + role;
  const b = document.createElement("div"); b.className = "bubble";
  m.appendChild(b); $("log").appendChild(m);
  if (role === "user") {
    files.forEach(f => {
      if (f.kind === "image") { const im = document.createElement("img"); im.className = "thumb"; im.src = f.dataUrl; b.appendChild(im); }
      else { const c = document.createElement("span"); c.className = "chip"; c.textContent = "📄 " + f.name; b.appendChild(c); b.appendChild(document.createElement("br")); }
    });
    b.appendChild(document.createTextNode(text));
  } else setAssistant(b, text);
  scrollDown(); return b;
}
function setAssistant(el, text) { el.innerHTML = DOMPurify.sanitize(marked.parse(text || "…")); }
function scrollDown() { $("chat").scrollTop = $("chat").scrollHeight; }

// ---------- request building ----------
function userText(m) {
  let t = m.text;
  const docs = m.files.filter(f => f.kind === "text");
  if (docs.length) t = docs.map(f => `<file name="${f.name}">\n${f.text}\n</file>`).join("\n\n") + (t ? "\n\n" + t : "");
  return t || "(see attached)";
}
function buildBody(provider) {
  const sys = store.get("system").trim();
  const msgs = messages.map(m => {
    if (m.role === "assistant") return { role:"assistant", content:m.text };
    const imgs = m.files.filter(f => f.kind === "image");
    const text = userText(m);
    if (!imgs.length) return { role:"user", content:text };
    if (provider === "anthropic") {
      return { role:"user", content:[
        ...imgs.map(f => ({ type:"image", source:{ type:"base64", media_type:f.mime, data:f.dataUrl.split(",")[1] } })),
        { type:"text", text } ] };
    }
    return { role:"user", content:[ { type:"text", text },
      ...imgs.map(f => ({ type:"image_url", image_url:{ url:f.dataUrl } })) ] };
  });
  const body = {
    model: store.get("model", "claude-opus-4.7"),
    max_tokens: parseInt(store.get("maxTokens", "8192"), 10) || 8192,
    temperature: parseFloat(store.get("temperature", "1")),
    stream: true
  };
  if (provider === "anthropic") { body.messages = msgs; if (sys) body.system = sys; }
  else body.messages = sys ? [{ role:"system", content:sys }, ...msgs] : msgs;
  return body;
}

// ---------- chat ----------
async function send() {
  if (controller) { controller.abort(); return; }
  const text = $("input").value.trim();
  if (!text && !pending.length) return;

  const provider = store.get("provider", "openai");
  const proxy = store.get("proxy"), key = store.get("apiKey");
  if (!proxy && !key) { $("dlg").showModal(); return; }

  const files = pending; pending = []; renderChips();
  $("input").value = ""; autosize();
  addMsg("user", text, files);
  messages.push({ role:"user", text, files });

  const bubble = addMsg("assistant");
  let full = "";
  controller = new AbortController();
  $("sendBtn").textContent = "Stop";

  const url = proxy || store.get("endpoint", DEFAULT_ENDPOINT[provider]);
  const headers = { "content-type":"application/json" };
  if (!proxy) {
    if (provider === "anthropic") {
      headers["x-api-key"] = key;
      headers["anthropic-version"] = "2023-06-01";
      headers["anthropic-dangerous-direct-browser-access"] = "true";
    } else headers["authorization"] = "Bearer " + key;
  }

  try {
    const res = await fetch(url, { method:"POST", headers, body:JSON.stringify(buildBody(provider)), signal:controller.signal });
    if (!res.ok) {
      let msg = res.status + " " + res.statusText;
      try { const j = await res.json(); msg = j.error?.message || j.message || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const parts = buf.split(/\r?\n\r?\n/); buf = parts.pop();
      for (const part of parts) {
        for (const line of part.split(/\r?\n/)) {
          if (!line.startsWith("data:")) continue;
          const data = line.slice(5).trim();
          if (!data || data === "[DONE]") continue;
          let ev; try { ev = JSON.parse(data); } catch { continue; }
          if (ev.error) throw new Error(ev.error.message || "Stream error");
          const delta = provider === "anthropic"
            ? (ev.type === "content_block_delta" ? ev.delta?.text : "")
            : ev.choices?.[0]?.delta?.content;
          if (delta) { full += delta; setAssistant(bubble, full); scrollDown(); }
        }
      }
    }
    messages.push({ role:"assistant", text:full, files:[] });
  } catch (e) {
    if (e.name === "AbortError") {
      if (full) messages.push({ role:"assistant", text:full, files:[] }); else messages.pop();
    } else {
      messages.pop();
      const hint = e instanceof TypeError
        ? " (network or CORS error: the endpoint may block requests from browsers; if so, use the proxy option)" : "";
      const p = document.createElement("p"); p.className = "err"; p.textContent = "⚠ " + e.message + hint;
      bubble.appendChild(p);
    }
  } finally {
    controller = null; $("sendBtn").textContent = "Send";
  }
}

function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("sendBtn").onclick = send;
$("newBtn").onclick = () => { if (controller) controller.abort(); messages = []; pending = []; renderChips(); renderEmpty(); };
renderEmpty();
</script>
</body>
</html>
